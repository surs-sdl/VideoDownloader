<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Instant Video Downloader</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      width: 340px;
      margin: 0;
      padding: 18px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background: #ffffff;
      color: #1f2937;
    }

    .header {
      margin-bottom: 16px;
    }

    .header h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }

    .header p {
      margin: 5px 0 0;
      font-size: 12px;
      color: #6b7280;
      line-height: 1.4;
    }

    .preview-container {
      width: 100%;
      min-height: 150px;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      background: #f3f4f6;
      border: 1px solid #e5e7eb;
      border-radius: 10px;

      margin-bottom: 14px;
    }

    #thumbnail {
      display: none;

      width: 100%;
      max-height: 190px;

      object-fit: contain;
    }

    #previewMessage {
      padding: 20px;

      text-align: center;
      font-size: 12px;
      color: #6b7280;
    }

    .info-card {
      display: none;

      padding: 10px;

      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 8px;

      margin-bottom: 12px;
    }

    .info-label {
      margin-bottom: 4px;

      font-size: 11px;
      font-weight: 600;

      color: #374151;
    }

    #videoUrl {
      font-size: 11px;
      color: #6b7280;

      word-break: break-all;
      line-height: 1.4;
    }

    #downloadBtn {
      width: 100%;

      padding: 11px 14px;

      border: none;
      border-radius: 8px;

      background: #111827;
      color: #ffffff;

      font-size: 14px;
      font-weight: 600;

      cursor: pointer;

      transition:
        opacity 0.2s ease,
        transform 0.1s ease;
    }

    #downloadBtn:hover:not(:disabled) {
      opacity: 0.9;
    }

    #downloadBtn:active:not(:disabled) {
      transform: scale(0.99);
    }

    #downloadBtn:disabled {
      background: #d1d5db;
      cursor: not-allowed;
    }

    #status {
      margin-top: 12px;

      min-height: 18px;

      text-align: center;
      font-size: 12px;
      line-height: 1.4;

      color: #4b5563;
    }

    .note {
      margin-top: 14px;
      padding-top: 12px;

      border-top: 1px solid #e5e7eb;

      font-size: 10px;
      line-height: 1.5;

      color: #9ca3af;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>Instant Video Downloader</h1>

    <p>
      Detect a direct HTML5 video source from the current page.
    </p>
  </div>

  <div class="preview-container">

    <img
      id="thumbnail"
      alt="Video preview"
    >

    <div id="previewMessage">
      Searching for a video...
    </div>

  </div>

  <div
    class="info-card"
    id="videoInfo"
  >

    <div class="info-label">
      Detected source
    </div>

    <div id="videoUrl"></div>

  </div>

  <button
    id="downloadBtn"
    disabled
  >
    Download Video
  </button>

  <div id="status">
    Scanning the current page...
  </div>

  <div class="note">
    Works with direct HTML5 video sources.
    Some streaming, DRM-protected, or blob-based videos are not supported.
  </div>

  <script src="popup.js"></script>

</body>
</html>
